name: Crew
options:
  bundleIdPrefix: dev.jacksonwilson
  deploymentTarget:
    iOS: '17.0'
packages:
  CrewCore:
    path: CrewCore
settings:
  base:
    SWIFT_VERSION: '5.9'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Crew:
    type: application
    platform: iOS
    sources: [Crew, Shared]
    dependencies:
      - package: CrewCore
      - target: CrewWidgets
      - target: CrewWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jacksonwilson.crew
        TARGETED_DEVICE_FAMILY: '1'
    info:
      path: Generated/Crew-Info.plist
      properties:
        CFBundleDisplayName: Crew
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: Crew
            CFBundleURLSchemes: [crew]
    entitlements:
      path: Generated/Crew.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.jacksonwilson.crew]
  CrewWidgets:
    type: app-extension
    platform: iOS
    sources: [CrewWidgets, Shared]
    dependencies:
      - package: CrewCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jacksonwilson.crew.widgets
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Generated/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Crew
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.jacksonwilson.crew]
  CrewWatch:
    type: application
    platform: watchOS
    deploymentTarget: '10.0'
    sources: [CrewWatch]
    dependencies:
      - package: CrewCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jacksonwilson.crew.watch
        SKIP_INSTALL: YES
    info:
      path: Generated/Watch-Info.plist
      properties:
        CFBundleDisplayName: Crew
        WKApplication: true
        WKCompanionAppBundleIdentifier: dev.jacksonwilson.crew
  CrewUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CrewUITests]
    dependencies:
      - target: Crew
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jacksonwilson.crew.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Crew:
    build:
      targets:
        Crew: all
    test:
      targets: [CrewUITests]
  CrewWatch:
    build:
      targets:
        CrewWatch: all
